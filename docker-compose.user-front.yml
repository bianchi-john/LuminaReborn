# Original web interface of the user-manager (optional: user management
# is already available in the app, at /area/utenti). Publishes the API and the interface
# on localhost only:
#   docker compose -f docker-compose.yml -f docker-compose.user-front.yml up -d
services:
  user-manager-api:
    ports:
      - "127.0.0.1:7071:80"

  user-manager-front:
    image: moreillon/user-manager-mongoose-front
    logging:
      driver: none
    environment:
      # The front end runs in the browser: it must reach the API via the local address
      VUE_APP_USER_MANAGER_API_URL: ${USER_MANAGER_FRONT_API_URL:-http://localhost:7071}
    ports:
      - "127.0.0.1:${USER_MANAGER_FRONT_PORT:-8080}:80"
    networks:
      internalnet:
        ipv4_address: ${USER_MANAGER_FRONT_CONTAINER_IP}
