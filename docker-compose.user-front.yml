# Interfaccia web originale dello user-manager (facoltativa: la gestione utenti
# è già disponibile nell'app, in /area/utenti). Pubblica l'API e l'interfaccia
# solo su localhost:
#   docker compose -f docker-compose.yml -f docker-compose.user-front.yml up -d
services:
  user-manager-api:
    ports:
      - "127.0.0.1:7071:80"

  user-manager-front:
    image: moreillon/user-manager-mongoose-front
    logging:
      driver: none
    environment:
      # Il front gira nel browser: deve raggiungere l'API con l'indirizzo locale
      VUE_APP_USER_MANAGER_API_URL: ${USER_MANAGER_FRONT_API_URL:-http://localhost:7071}
    ports:
      - "127.0.0.1:${USER_MANAGER_FRONT_PORT:-8080}:80"
    networks:
      internalnet:
        ipv4_address: ${USER_MANAGER_FRONT_CONTAINER_IP}
