# Development: the app runs with tsx in watch mode and reads sources, templates and
# static files directly from the project folder. Every change is visible
# immediately (TypeScript: automatic restart in ~1 s; EJS/CSS/JS: just reload the page).
#   make dev     (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build)
services:
  nodeapp:
    build:
      context: .
      target: dev
    image: lumina-app:dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    read_only: false
    volumes:
      - ./src:/app/src
      - ./views:/app/views
      - ./public:/app/public
      - ./migrations:/app/migrations
      - ./test:/app/test
      - ${BACKUP_DIR:-./backups}/excel:/exports

  # Automatic backup is not needed in development (`make backup` is still available)
  backup:
    profiles: ["backup"]
