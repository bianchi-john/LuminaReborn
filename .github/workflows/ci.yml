# Automatic checks on every push and pull request: types, unit tests,
# complete translations, Docker image build and dependency audit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Reports known vulnerabilities in production dependencies. Non-blocking
      # while the librsvg advisory in sharp is open (it only affects SVGs, which
      # the app rejects before processing them): remove continue-on-error with sharp >= 0.35.5.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t lumina-app:ci .
