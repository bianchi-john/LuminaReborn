# LUMiNA - full stack. Start: `make up` (or `docker compose up -d --build`).
# Development with automatic reload: `make dev` (see docs/DEVELOPMENT.md).
services:
  mysqldb:
    image: mysql:8.4
    container_name: mysqlcontainer
    restart: unless-stopped
    volumes:
      # Docker volume (reset with `make reset-demo`), or a host folder via MYSQL_DATA_DIR
      - ${MYSQL_DATA_DIR:-mysql-data}:/var/lib/mysql
      # Run only on first start: media database, schema and demo works
      - ./dbinit:/docker-entrypoint-initdb.d:ro
    # Local machine only (maintenance, development): never exposed on the network
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-letmein}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-letmein}
      MYSQL_DATABASE: ${DB_NAME:-luminadb}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-luminamedia}
    healthcheck:
      # During initialisation MySQL does not accept TCP connections: "healthy" = ready
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      internalnet:
        ipv4_address: ${MYSQL_CONTAINER_IP}

  nodeapp:
    container_name: nodeappcontainer
    build: .
    image: lumina-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-letmein}
      DB_NAME: ${DB_NAME:-luminadb}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-luminamedia}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      SERVER_PORT: 3000
      USER_MANAGER_API_URL: ${USER_MANAGER_API_URL:-http://user-manager-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-25}
      MAX_IMAGE_LATO_PX: ${MAX_IMAGE_LATO_PX:-20000}
      MAX_IMAGE_MEGAPIXEL: ${MAX_IMAGE_MEGAPIXEL:-150}
      SCRAPING_PROTEZIONE: ${SCRAPING_PROTEZIONE:-true}
      SCRAPING_PAGINE_MINUTO: ${SCRAPING_PAGINE_MINUTO:-60}
      SCRAPING_PAGINE_ORA: ${SCRAPING_PAGINE_ORA:-600}
      SCRAPING_MEDIA_MINUTO: ${SCRAPING_MEDIA_MINUTO:-600}
      SCRAPING_MEDIA_ORA: ${SCRAPING_MEDIA_ORA:-6000}
      SCRAPING_API_MINUTO: ${SCRAPING_API_MINUTO:-300}
      SCRAPING_BLOCCO_MINUTI: ${SCRAPING_BLOCCO_MINUTI:-60}
      MEDIA_PREVIEW_PX: ${MEDIA_PREVIEW_PX:-1280}
      MEDIA_WATERMARK: ${MEDIA_WATERMARK:-© Musei Nazionali di Lucca}
      EXPORT_DIR: /exports
      EXPORT_FOTO_DIR: /exports-foto
      EXPORT_HOUR: ${EXPORT_HOUR:-2}
      EXPORT_KEEP: ${BACKUP_KEEP_DAYS:-14}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      - ${BACKUP_DIR:-./backups}/excel:/exports
      - ${BACKUP_DIR:-./backups}/foto:/exports-foto
    depends_on:
      mysqldb:
        condition: service_healthy
      user-manager-api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    # The app needs no kernel capabilities (it listens on port 3000)
    cap_drop:
      - ALL
    networks:
      internalnet:
        ipv4_address: ${NODEAPP_CONTAINER_IP}
      extern:

  # Daily backup of catalogue and images (compressed mysqldump, with rotation)
  # in ./backups/db. Immediate backup: `make backup`.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/backup.sh"]
    command: ["loop"]
    environment:
      DB_HOST: mysqldb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-letmein}
      DB_NAME: ${DB_NAME:-luminadb}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-luminamedia}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Rome
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      internalnet:

  # One-shot service: creates the demo cataloguers on first start.
  # The administrator, instead, is created automatically by the user-manager.
  user-seed:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      - user-manager-api
    environment:
      USER_MANAGER_API_URL: http://user-manager-api
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-users.sh"]
    networks:
      internalnet:

  mongo:
    image: mongo:7.0
    container_name: mongocontainer
    restart: unless-stopped
    # Authentication enabled: administrator + dedicated user for the user-manager
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-letmein}
      MONGO_APP_DB: user_manager
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-user_manager}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-letmein}
    volumes:
      - ${MONGO_DATA_DIR:-mongo-data}:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: none
    networks:
      internalnet:
        ipv4_address: ${MONGO_CONTAINER_IP}

  # Authentication and users. Reachable only from the internal network: the app
  # acts as its proxy (login, user management in /area/utenti). Must not be exposed:
  # its API also returns password hashes and publishes /docs and /metrics.
  # Image pinned by digest (the only published tag is "latest").
  user-manager-api:
    image: moreillon/user-manager-mongoose@sha256:24d5e49257138b8f824331355373aefa7f48a07c193d4ea1dc54a6a0fd406402
    restart: unless-stopped
    environment:
      MONGODB_HOST: mongo
      MONGODB_DB: user_manager
      MONGODB_USERNAME: ${MONGO_APP_USERNAME:-user_manager}
      MONGODB_PASSWORD: ${MONGO_APP_PASSWORD:-letmein}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - mongo
    networks:
      internalnet:
        ipv4_address: ${USER_MANAGER_API_CONTAINER_IP}

volumes:
  mysql-data:
  mongo-data:

networks:
  extern:
    external: true
  internalnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORKS_SUBNET_IP}
          gateway: ${NETWORKS_GATEWAY_IP}
