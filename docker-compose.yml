# LUMiNA - stack completo. Avvio: `make up` (o `docker compose up -d --build`).
# Sviluppo con ricarica automatica: `make dev` (vedi docs/SVILUPPO.md).
services:
  mysqldb:
    image: mysql:8.4
    container_name: mysqlcontainer
    restart: unless-stopped
    volumes:
      # Volume Docker (reset con `make reset-demo`), oppure una cartella dell'host via MYSQL_DATA_DIR
      - ${MYSQL_DATA_DIR:-mysql-data}:/var/lib/mysql
      # Eseguiti solo al primo avvio: database media, schema e opere dimostrative
      - ./dbinit:/docker-entrypoint-initdb.d:ro
    # Solo dalla macchina locale (manutenzione, sviluppo): mai esposto in rete
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-letmein}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-letmein}
      MYSQL_DATABASE: ${DB_NAME:-luminadb}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-luminamedia}
    healthcheck:
      # Durante l'inizializzazione MySQL non accetta connessioni TCP: "healthy" = pronto
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      internalnet:
        ipv4_address: ${MYSQL_CONTAINER_IP}

  nodeapp:
    container_name: nodeappcontainer
    build: .
    image: lumina-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-letmein}
      DB_NAME: ${DB_NAME:-luminadb}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-luminamedia}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      SERVER_PORT: 3000
      USER_MANAGER_API_URL: ${USER_MANAGER_API_URL:-http://user-manager-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-25}
      MEDIA_PREVIEW_PX: ${MEDIA_PREVIEW_PX:-1280}
      MEDIA_WATERMARK: ${MEDIA_WATERMARK:-© Musei Nazionali di Lucca}
      EXPORT_DIR: /exports
      EXPORT_HOUR: ${EXPORT_HOUR:-2}
      EXPORT_KEEP: ${BACKUP_KEEP_DAYS:-14}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      - ${BACKUP_DIR:-./backups}/excel:/exports
    depends_on:
      mysqldb:
        condition: service_healthy
      user-manager-api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # L'app non ha bisogno di alcuna capability del kernel (ascolta sulla porta 3000)
    cap_drop:
      - ALL
    networks:
      internalnet:
        ipv4_address: ${NODEAPP_CONTAINER_IP}
      extern:

  # Backup giornaliero di catalogo e immagini (mysqldump compresso, con rotazione)
  # in ./backups/db. Backup immediato: `make backup`.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/backup.sh"]
    command: ["loop"]
    environment:
      DB_HOST: mysqldb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-letmein}
      DB_NAME: ${DB_NAME:-luminadb}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-luminamedia}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Rome
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      internalnet:

  # Servizio one-shot: crea gli schedatori dimostrativi al primo avvio.
  # L'amministratore viene invece creato automaticamente dallo user-manager.
  user-seed:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      - user-manager-api
    environment:
      USER_MANAGER_API_URL: http://user-manager-api
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-users.sh"]
    networks:
      internalnet:

  mongo:
    image: mongo:7.0
    container_name: mongocontainer
    restart: unless-stopped
    # Autenticazione attiva: amministratore + utente dedicato allo user-manager
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-letmein}
      MONGO_APP_DB: user_manager
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-user_manager}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-letmein}
    volumes:
      - ${MONGO_DATA_DIR:-mongo-data}:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: none
    networks:
      internalnet:
        ipv4_address: ${MONGO_CONTAINER_IP}

  # Autenticazione e utenti. Raggiungibile solo dalla rete interna: l'app ne fa
  # da proxy (login, gestione utenti in /area/utenti). Non va esposto: la sua
  # API restituisce anche gli hash delle password e pubblica /docs e /metrics.
  # Immagine fissata per digest (l'unico tag pubblicato è "latest").
  user-manager-api:
    image: moreillon/user-manager-mongoose@sha256:24d5e49257138b8f824331355373aefa7f48a07c193d4ea1dc54a6a0fd406402
    restart: unless-stopped
    environment:
      MONGODB_HOST: mongo
      MONGODB_DB: user_manager
      MONGODB_USERNAME: ${MONGO_APP_USERNAME:-user_manager}
      MONGODB_PASSWORD: ${MONGO_APP_PASSWORD:-letmein}
      JWT_SECRET: ${JWT_SECRET:?Impostare JWT_SECRET nel file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - mongo
    networks:
      internalnet:
        ipv4_address: ${USER_MANAGER_API_CONTAINER_IP}

volumes:
  mysql-data:
  mongo-data:

networks:
  extern:
    external: true
  internalnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORKS_SUBNET_IP}
          gateway: ${NETWORKS_GATEWAY_IP}
