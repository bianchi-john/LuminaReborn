services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqlcontainer
    restart: unless-stopped
    volumes:
      - ./database-data:/var/lib/mysql
      - ./dbinit:/docker-entrypoint-initdb.d
      - ./attach:/usr/lumina/attach
    ports:
      - 3306:3306
    expose:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: letmein
      MYSQL_USER: admin
      MYSQL_PASSWORD: letmein
      MYSQL_DATABASE: luminadb
      SERVICE_TAGS: prod
      SERVICE_NAME: mysqldb
    networks:
      internalnet: 
        ipv4_address: ${MYSQL_CONTAINER_IP}

  nodeapp:
    container_name: nodeappcontainer
    build: .
    image: nodeapp:v1
    environment:
      DB_HOST: mysqldb 
      DB_USER: admin
      DB_PASSWORD: letmein
      DB_NAME: luminadb
      DB_PORT: 3306
      DB_CONNECTION_LIMIT: 100
      SERVER_PORT: 3000
      SERVICE_TAGS: prod
      SERVICE_NAME: nodeappservice
      VUE_APP_USER_MANAGER_API_URL: user-manager-api:7071
      USER_MANAGER_API_URL: ${USER_MANAGER_API_URL}
    ports:
      - 3000:3000
    expose:
      - 3000
    depends_on:
      - mysqldb
      - user-manager-api
    networks:
      internalnet: 
        ipv4_address: ${NODEAPP_CONTAINER_IP}
      extern:

  # Servizio one-shot: crea gli schedatori dimostrativi al primo avvio.
  # L'amministratore viene invece creato automaticamente dallo user-manager.
  user-seed:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      - user-manager-api
    environment:
      USER_MANAGER_API_URL: http://user-manager-api
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-users.sh"]
    networks:
      internalnet:

  mongo:
    image: mongo:7.0
    container_name: mongocontainer
    volumes:
      - ./user-data/mongo-data:/data/db
    logging:
      driver: none
    networks:
      internalnet: 
        ipv4_address: ${MONGO_CONTAINER_IP}

  user-manager-api:
    image: moreillon/user-manager-mongoose
    environment:
      MONGODB_URL: mongodb://${MONGO_CONTAINER_IP}
      JWT_SECRET: sonoVVNÀAFINVASDVNNSJljnval
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "7071:80"
    depends_on:
      - mongo
    networks:
      internalnet: 
        ipv4_address: ${USER_MANAGER_API_CONTAINER_IP}

  user-manager-front:
    image: moreillon/user-manager-mongoose-front
    logging:
      driver: none
    environment:
      # Il front gira nel BROWSER: deve raggiungere l'API con l'indirizzo con cui
      # l'utente apre il sito (localhost in locale, indirizzo del server da remoto).
      VUE_APP_USER_MANAGER_API_URL: ${USER_MANAGER_FRONT_API_URL}
    ports:
      - "${USER_MANAGER_FRONT_PORT}:80"
    networks:
      internalnet:
        ipv4_address: ${USER_MANAGER_FRONT_CONTAINER_IP}

networks:
  extern:
    external: true
  internalnet:
    driver: bridge
    ipam:
      driver: default
      config: 
        - subnet: ${NETWORKS_SUBNET_IP}
          gateway: ${NETWORKS_GATEWAY_IP}
