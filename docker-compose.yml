services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqlcontainer
    restart: unless-stopped
    volumes:
      - ${MYSQL_DATA_DIR:-./database-data}:/var/lib/mysql
      - ./dbinit:/docker-entrypoint-initdb.d:ro
      - ./attach:/usr/lumina/attach
    # Solo dalla macchina locale (per mysqldump/manutenzione): mai esposto in rete
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-letmein}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-letmein}
      MYSQL_DATABASE: ${DB_NAME:-luminadb}
    healthcheck:
      # Durante l'inizializzazione MySQL non accetta connessioni TCP: "healthy" = pronto
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      internalnet:
        ipv4_address: ${MYSQL_CONTAINER_IP}

  nodeapp:
    container_name: nodeappcontainer
    build: .
    image: lumina-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-letmein}
      DB_NAME: ${DB_NAME:-luminadb}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      SERVER_PORT: 3000
      USER_MANAGER_API_URL: ${USER_MANAGER_API_URL:-http://user-manager-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-8}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-15}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      mysqldb:
        condition: service_healthy
      user-manager-api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      internalnet:
        ipv4_address: ${NODEAPP_CONTAINER_IP}
      extern:

  # Servizio one-shot: crea gli schedatori dimostrativi al primo avvio.
  # L'amministratore viene invece creato automaticamente dallo user-manager.
  user-seed:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      - user-manager-api
    environment:
      USER_MANAGER_API_URL: http://user-manager-api
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-users.sh"]
    networks:
      internalnet:

  mongo:
    image: mongo:7.0
    container_name: mongocontainer
    restart: unless-stopped
    volumes:
      - ${MONGO_DATA_DIR:-./user-data/mongo-data}:/data/db
    logging:
      driver: none
    networks:
      internalnet:
        ipv4_address: ${MONGO_CONTAINER_IP}

  # Autenticazione e utenti. Raggiungibile solo dalla rete interna: l'app ne fa
  # da proxy (login, gestione utenti in /area/utenti). Non va esposto: la sua
  # API restituisce anche gli hash delle password e pubblica /docs e /metrics.
  user-manager-api:
    image: moreillon/user-manager-mongoose
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_CONTAINER_IP}
      JWT_SECRET: ${JWT_SECRET:?Impostare JWT_SECRET nel file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - mongo
    networks:
      internalnet:
        ipv4_address: ${USER_MANAGER_API_CONTAINER_IP}

networks:
  extern:
    external: true
  internalnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORKS_SUBNET_IP}
          gateway: ${NETWORKS_GATEWAY_IP}
